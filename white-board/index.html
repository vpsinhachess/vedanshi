<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#fff7fc;--card:#fff;--ink:#2d2a4a;--mut:#7a7699;--ln:#e7e2f5;--soft:#efe9ff;--p:#7c5cff;--k:#ff5fa2}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1a33;--card:#2a2648;--ink:#f3efff;--mut:#a9a3d1;--ln:#3b3663;--soft:#3b3663}}
:root[data-theme=dark]{--bg:#1d1a33;--card:#2a2648;--ink:#f3efff;--mut:#a9a3d1;--ln:#3b3663;--soft:#3b3663}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:Fredoka,ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 5% 0,#ffc6e777,transparent 35%),radial-gradient(circle at 100% 10%,#b8e4ff77,transparent 35%)}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:6px;padding:6px 10px;position:relative;z-index:30}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;margin-right:auto;min-width:0}
.logo i{font-style:normal;font-size:26px;flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--ln)}
.logo b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{display:flex;gap:5px}
.hb button{width:42px;height:42px;border-radius:14px;background:var(--card);font-size:19px;box-shadow:0 3px 0 var(--ln);transition:transform .1s}
.hb button:active{transform:translateY(2px);box-shadow:none}
.hb button:disabled{opacity:.35}
.hb .pri{width:auto;padding:0 14px;background:linear-gradient(135deg,var(--p),var(--k));color:#fff;font-weight:700;box-shadow:0 3px 0 #5b3fd6}
.stage{container-type:size;display:grid;place-items:center;padding:2px 4px;min-height:0;min-width:0}
.frame{position:relative;width:min(100cqw,calc(100cqh*var(--r,1.3333)));aspect-ratio:var(--r,1.3333);padding:6px;border-radius:26px;background:var(--fg,linear-gradient(90deg,#ff5fa2,#ffb347,#ffe85a,#4ed88c,#4fc4ff,#8e69ff,#ff5fa2));box-shadow:0 14px 40px #3d2f8030,0 0 0 4px #fff}
.paper{position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;background:#fff}
.paper canvas{position:absolute;inset:0;width:100%;height:100%}
#ac{touch-action:none;cursor:crosshair}#lc,#oc{pointer-events:none}
.cn{position:absolute;z-index:2;font-size:clamp(18px,3.8vmin,34px);pointer-events:none;animation:bob 3.4s ease-in-out infinite}

.sw.on{box-shadow:0 0 0 3px var(--p);transform:scale(1.14)}
.cus{overflow:hidden;background:conic-gradient(#f44,#fa0,#ee3,#4d4,#4af,#84f,#f4a,#f44)}
.cus input{position:absolute;inset:-10px;width:200%;height:200%;opacity:0;cursor:pointer}

@media(max-height:480px){header{padding:3px 8px}.hb button,.logo i{height:36px}.logo i{width:36px}}
.L{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:var(--bg);background-image:radial-gradient(circle at 10% 10%,#ffc6e7aa,transparent 40%),radial-gradient(circle at 90% 90%,#b8e4ffaa,transparent 40%)}

.art{font-size:66px;animation:bob 2.4s ease-in-out infinite}
.go{width:100%;height:62px;border-radius:20px;color:#fff;font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--p),var(--k));box-shadow:0 6px 0 #5b3fd6}

@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app">
<header>
 <div class="logo"><i>🎨</i><b>VEDANSHI's White Board</b></div>
 <div class="hb">

 </div>
</aside>
</div>
<div class="L" id="L"><div class="card"><div class="art">🎨</div><h1>VEDANSHI's White Board</h1><p>Draw, colour and create!</p><button class="go" id="go">▶ Let's play!</button></div></div>
<div id="T" role="status"></div>

<script>
(()=>{
const $=s=>document.querySelector(s),PT=innerHeight>innerWidth*1.15,W=PT?1050:1400,H=PT?1400:1050;
const ac=$('#ac'),lc=$('#lc'),oc=$('#oc');ac.width=lc.width=oc.width=W;ac.height=lc.height=oc.height=H;
const ax=ac.getContext('2d',{willReadFrequently:true}),lx=lc.getContext('2d',{willReadFrequently:true});

const ST={'🐶':'🐶 🐱 🐭 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐸 🐵 🐷 🐮 🦄 🐢 🐠 🐙 🦋 🐞 🐘 🦒 🐧 🦉 🐝 🐬 🦈 🐳 🦜 🐥',
'🦸':'🦸 🦹 🧙 🧚 🧜 🧞 🧛 🥷 👸 🤴 🤖 👾 👻 🤡 🎅 ⛄ 🐉 🦖 🐲 🧸 👽 🧟 🤠 🦄',
'☁️':'☁️ ⛅ 🌤️ 🌥️ ☀️ 🌈 ⭐ 🌟 🌙 ⚡ ❄️ 🌧️ 🌪️ 💨 🪐 🌍 ☄️ 💧 🔥 🌊 🌋 🏔️',
'🌸':'🌸 🌺 🌻 🌷 🌹 🍀 🌳 🌴 🌵 🍄 🍁 🌾 🌿 🪴',

'😀':'😀 😁 😂 😍 🥰 😎 🤩 😴 😱 🤗 🥳 😇 🤠 😜 😘 🤪',
'🚀':'🚀 🚗 🚕 🚌 🚒 🚜 🚲 ✈️ 🚁 🛸 🚂 ⛵ 🚢 🏰 🏠 🎡',
'🎈':'🎈 🎉 🎁 🎨 🏆 👑 💎 ⚽ 🏀 🎸 🎵 🪁 💖 💫 ✨ 🎀 🔔 🪄'};
const fl=[];for(let i=0;i<6;i++){const a=i*Math.PI/3,x=200+Math.cos(a)*70,y=120+Math.sin(a)*70;fl.push(`M${x-30} ${y}a30 30 0 1 0 60 0a30 30 0 1 0-60 0Z`)}
const PG=[['⬜','Blank',[]],
['💖','Heart',['M200 255C70 170 50 90 105 58C148 34 188 58 200 92C212 58 252 34 295 58C350 90 330 170 200 255Z']],
['⭐','Star',['M200 30L238 112L328 122L262 182L282 270L200 226L118 270L138 182L72 122L162 112Z']],
['🏠','House',['M90 140H310V262H90Z','M65 142L200 38L335 142Z','M172 262V190Q200 168 228 190V262Z','M112 168H152V208H112Z','M248 168H288V208H248Z','M334 50a26 26 0 1 0 52 0a26 26 0 1 0-52 0Z','M20 262H380']],
['🌸','Flower',[...fl,'M162 120a38 38 0 1 0 76 0a38 38 0 1 0-76 0Z','M194 190H206V285H194Z','M206 245C250 215 280 232 292 252C262 266 226 266 206 245Z','M194 255C150 225 120 242 108 262C138 276 174 276 194 255Z']],
['🐠','Fish',['M70 150C120 60 250 60 290 150C250 240 120 240 70 150Z','M288 150L350 98V202Z','M120 135a10 10 0 1 0 20 0a10 10 0 1 0-20 0Z','M170 82C180 50 220 50 235 90Z','M72 150Q90 162 102 152','M30 100a12 12 0 1 0 24 0a12 12 0 1 0-24 0Z']],
['🦋','Butterfly',['M192 95H208V225Q200 250 192 225Z'],['M192 140C150 40 60 40 62 110C64 160 140 168 192 150Z','M192 160C140 170 80 180 96 235C112 275 175 250 192 205Z','M110 100a14 14 0 1 0 28 0a14 14 0 1 0-28 0Z','M196 95Q185 55 165 45']]];

const S={t:'pen',c:'#ff4d4d',sz:{pen:14,rb:24,sp:44,er:56,st:120,tx:72},sticker:'⭐',page:0,font:'Fredoka',snd:1,m:0,h:[],r:[],th:0};
let hue=0,pid=null,lp,pm,sl,AC,at,O=[],si=-1,D;

/* ---------- helpers ---------- */
const toast=m=>{const t=$('#T');t.textContent=m;t.classList.add('on');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('on'),1700)};
function snd(f=600,d=.08){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.6,t+d);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}

const pt=e=>{const r=ac.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height,p:e.pointerType==='pen'&&e.pressure?e.pressure:.5}};

/* ---------- history (ImageData: instant, lossless) ---------- */
const snap=()=>({d:ax.getImageData(0,0,W,H),p:S.page,o:JSON.stringify(O)});
const hp=(a,s)=>{a.push(s);if(a.length>8)a.shift()};

let base=null,dirty=0,ct;

 at=setTimeout(()=>{try{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(ac,0,0);x.drawImage(oc,0,0);localStorage.setItem('vb',JSON.stringify({a:c.toDataURL('image/jpeg',.7),p:S.page,w:W}))}catch(e){}},1200)};
function save(){if(dirty||!base){base=snap();dirty=0}hp(S.h,base);S.r=[];upd()}
function put(s){ax.putImageData(s.d,0,0);O=JSON.parse(s.o);si=-1;render();if(O.length&&S.t!=='st'&&S.t!=='tx')setTool('st');if(s.p!==S.page){S.page=s.p;drawPage()}done()}

function redo(){if(!S.r.length)return;hp(S.h,snap());put(S.r.pop());snd(400)}

/* ---------- colouring pages (outline layer sits above the paint) ---------- */
function drawPage(){const p=PG[S.page];lx.setTransform(1,0,0,1,0,0);lx.clearRect(0,0,W,H);lx.strokeStyle='#2d2a4a';lx.lineWidth=2.4;lx.lineJoin=lx.lineCap='round';
 const k=W/400,oy=(H-300*k)/2;lx.setTransform(k,0,0,k,0,oy);p[2].forEach(d=>lx.stroke(new Path2D(d)));
 lx.setTransform(-k,0,0,k,W,oy);(p[3]||[]).forEach(d=>lx.stroke(new Path2D(d)));lx.setTransform(1,0,0,1,0,0);
 document.querySelectorAll('#pgs button').forEach((b,i)=>b.classList.toggle('on',i===S.page))}
function setPage(i){save();ax.fillStyle='#fff';ax.fillRect(0,0,W,H);O=[];si=-1;render();S.page=i;drawPage();done();setTool(i?'fl':'pen');toast(i?'Tap a shape to fill it! 🪣':'Blank page ✨');snd(700,.12)}

/* ---------- drawing ---------- */
function sty(c){ax.lineCap=ax.lineJoin='round';ax.strokeStyle=ax.fillStyle=S.t==='er'?'#fff':S.t==='rb'?`hsl(${hue=(hue+4)%360},90%,55%)`:S.c;ax.lineWidth=S.sz[S.t]*(.4+1.2*c.p)}
function dot(p){sty(p);ax.beginPath();ax.arc(p.x,p.y,ax.lineWidth/2,0,7);ax.fill()}
function seg(a,c,b){sty(c);ax.beginPath();ax.moveTo(a.x,a.y);ax.quadraticCurveTo(c.x,c.y,b.x,b.y);ax.stroke()}
function spark(a,b){const s=S.sz.sp,d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/(s*.35)));
 for(let i=0;i<n;i++){const t=(i+1)/n,x=a.x+(b.x-a.x)*t+(Math.random()-.5)*s,y=a.y+(b.y-a.y)*t+(Math.random()-.5)*s,r=s*(.12+Math.random()*.28);
  ax.fillStyle=Math.random()<.25?'#fff':S.c;ax.shadowColor=S.c;ax.shadowBlur=r;
  ax.beginPath();ax.moveTo(x,y-r);ax.quadraticCurveTo(x,y,x+r,y);ax.quadraticCurveTo(x,y,x,y+r);ax.quadraticCurveTo(x,y,x-r,y);ax.quadraticCurveTo(x,y,x,y-r);ax.fill()}
 ax.shadowBlur=0}
function flood(p){const x=p.x|0,y=p.y|0,i0=y*W+x,im=ax.getImageData(0,0,W,H),d=new Uint32Array(im.data.buffer),L=lx.getImageData(0,0,W,H).data;
 if(L[i0*4+3]>90){toast('Tap inside a shape 😊');return}
 const t=d[i0],tr=t&255,tg=t>>8&255,tb=t>>16&255,h=S.c,c=(255<<24)|(parseInt(h.slice(5,7),16)<<16)|(parseInt(h.slice(3,5),16)<<8)|parseInt(h.slice(1,3),16);
 if(t===c)return;save();
 const seen=new Uint8Array(W*H),st=[i0];seen[i0]=1;
 const nb=j=>{if(seen[j])return;seen[j]=1;if(L[j*4+3]>90)return;const v=d[j];if(Math.abs((v&255)-tr)+Math.abs((v>>8&255)-tg)+Math.abs((v>>16&255)-tb)>90)return;st.push(j)};
 while(st.length){const i=st.pop(),cx=i%W;d[i]=c;if(cx>0)nb(i-1);if(cx<W-1)nb(i+1);if(i>=W)nb(i-W);if(i<W*H-W)nb(i+W)}
 ax.putImageData(im,0,0);done();snd(760,.15);pop(6,innerWidth/2,innerHeight/2)}

/* ---------- movable stickers & text ---------- */
const ox=oc.getContext('2d'),sel=$('#sel'),EF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif',mi=p=>({x:W-p.x,y:p.y,p:p.p});
function render(){ox.clearRect(0,0,W,H);for(const o of O){ox.save();ox.translate(o.x,o.y);ox.rotate(o.r);ox.textAlign='center';ox.textBaseline='middle';
 if(o.k==='t'){ox.font=`600 ${o.z}px "${o.f}",cursive`;ox.fillStyle=o.c;ox.shadowColor='#0003';ox.shadowBlur=4;o.w=ox.measureText(o.s).width+16;o.h=o.z*1.25}
 else{ox.font=`${o.z}px ${EF}`;o.w=o.h=o.z*1.15}
 ox.fillText(o.s,0,0);ox.restore()}place()}
function place(){const o=O[si];sel.hidden=!o;if(!o)return;const a=ac.getBoundingClientRect(),f=$('#fr').getBoundingClientRect(),k=a.width/W;
 Object.assign(sel.style,{left:a.left-f.left+o.x*k+'px',top:a.top-f.top+o.y*k+'px',width:Math.max(o.w*k,56)+'px',height:Math.max(o.h*k,56)+'px',transform:`translate(-50%,-50%) rotate(${o.r}rad)`})}
let E=0,et;function edited(){if(!E){save();E=1}clearTimeout(et);et=setTimeout(()=>{E=0;done()},400)}
function pick(i){si=i;const o=O[i];if(o){const k=o.k==='e'?'st':'tx';S.sz[k]=Math.min(o.z,RG[k][1]);if(S.t===k){$('#sz').value=S.sz[k];$('#szv').textContent=Math.round(S.sz[k])}
 if(o.k==='t'){$('#ti').value=o.s;S.font=o.f;$('#fs').value=o.f}}place()}
function hit(p){for(let i=O.length-1;i>=0;i--){const o=O[i],dx=p.x-o.x,dy=p.y-o.y,c=Math.cos(o.r),s=Math.sin(o.r),x=dx*c+dy*s,y=-dx*s+dy*c;if(Math.abs(x)<=o.w/2&&Math.abs(y)<=o.h/2)return i}return -1}
function addObj(o){save();O.push(o);pick(O.length-1);render();done();snd(700,.1);if(o.f)document.fonts.load(`40px "${o.f}"`).then(render,()=>0)}
function bake(){if(!O.length)return;save();ax.drawImage(oc,0,0);O=[];si=-1;render();done()}
sel.addEventListener('pointerdown',e=>{const o=O[si];if(!o)return;e.preventDefault();e.stopPropagation();sel.setPointerCapture(e.pointerId);const c=pt(e),h=e.target.closest('[data-h]');
 D={h:h?h.dataset.h:'m',o:{...o},c,a:Math.atan2(c.y-o.y,c.x-o.x),d:Math.hypot(c.x-o.x,c.y-o.y)||1}});
sel.addEventListener('pointermove',e=>{if(!D)return;const o=O[si],p=pt(e);if(!D.s&&'msr'.includes(D.h)){save();D.s=1}
 if(D.h==='m'){o.x=D.o.x+p.x-D.c.x;o.y=D.o.y+p.y-D.c.y}
 else if(D.h==='s')o.z=Math.max(14,Math.min(1000,D.o.z*Math.hypot(p.x-o.x,p.y-o.y)/D.d));
 else if(D.h==='r')o.r=D.o.r+Math.atan2(p.y-o.y,p.x-o.x)-D.a;
 render()});
sel.addEventListener('pointerup',()=>{if(!D)return;const h=D.h;D=null;
 if(h==='x'){save();O.splice(si,1);pick(-1);render();snd(300)}
 else if(h==='d'){save();O.push({...O[si],x:O[si].x+50,y:O[si].y+50});pick(O.length-1);render();snd(700)}
 done()});
sel.addEventListener('pointercancel',()=>{D=null});
$('#ti').oninput=()=>{const o=O[si];if(o&&o.k==='t'){edited();o.s=$('#ti').value||' ';render()}};
$('#mir').onclick=e=>{S.m^=1;document.querySelector('.paper').classList.toggle('mi',!!S.m);e.currentTarget.classList.toggle('on',!!S.m);e.currentTarget.textContent='🦋 Mirror '+(S.m?'on':'off');snd(600)};
function fz(on){document.body.classList.toggle('fz',on);try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>0);else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}setTimeout(place,80)}
$('#fz').onclick=()=>fz(1);$('#fb').onclick=()=>fz(0);$('#fu').onclick=undo;$('#fre').onclick=redo;addEventListener('resize',place);new ResizeObserver(place).observe($('#fr'));
const mn=$('#mn'),br=$('#br');
$('#mo').onclick=e=>{mn.hidden=!mn.hidden;e.currentTarget.setAttribute('aria-expanded',String(!mn.hidden))};
mn.onclick=()=>{mn.hidden=true};
addEventListener('pointerdown',e=>{if(!mn.hidden&&!mn.contains(e.target)&&e.target.id!=='mo')mn.hidden=true},true);
$('#ti').addEventListener('focus',e=>setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),300));
ac.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||!['pen','rb','er','sp'].includes(S.t)){br.style.display='none';return}
 const d=S.sz[S.t]*ac.getBoundingClientRect().width/W;Object.assign(br.style,{display:'block',left:e.clientX+'px',top:e.clientY+'px',width:d+'px',height:d+'px'})});
ac.addEventListener('pointerleave',()=>{br.style.display='none'});

ac.addEventListener('pointerdown',e=>{
 if(pid!==null)return;e.preventDefault();const p=pt(e),t=S.t;
 if(t==='st'||t==='tx'){const i=hit(p);if(i>=0){pick(i);render()}else if(t==='st')addObj({k:'e',s:S.sticker,x:p.x,y:p.y,z:S.sz.st,r:0});else addObj({k:'t',s:$('#ti').value.trim()||'Hello!',x:p.x,y:p.y,z:S.sz.tx,r:0,f:S.font,c:S.c});return}
 if(t==='fl'){flood(p);return}
 if(t==='pg')return;
 save();pid=e.pointerId;try{ac.setPointerCapture(pid)}catch(x){}
 lp=pm=sl=p;
 const M=S.m&&['pen','rb','sp'].includes(t);if(t==='sp'){spark(p,p);M&&spark(mi(p),mi(p))}else{dot(p);M&&dot(mi(p))}});
ac.addEventListener('pointermove',e=>{
 if(e.pointerId!==pid)return;e.preventDefault();
 const ev=e.getCoalescedEvents?.();
 for(const q of(ev&&ev.length?ev:[e])){const p=pt(q),t=S.t;
  const M=S.m&&['pen','rb','sp'].includes(t);
  if(t==='sp'){spark(lp,p);M&&spark(mi(lp),mi(p));lp=p}
  else{const m={x:(lp.x+p.x)/2,y:(lp.y+p.y)/2,p:p.p};seg(pm,lp,m);M&&seg(mi(pm),mi(lp),mi(m));pm=m;lp=p}}});
const end=e=>{if(e.pointerId!==pid)return;if(['pen','rb','er'].includes(S.t)){seg(pm,lp,lp);if(S.m&&S.t!=='er')seg(mi(pm),mi(lp),mi(lp))}pid=null;done()};
ac.addEventListener('pointerup',end);ac.addEventListener('pointercancel',end);

/* ---------- UI ---------- */
function setTool(t){if(t!=='st'&&t!=='tx'&&O.length)bake();S.t=t;
 document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 document.querySelectorAll('[data-f]').forEach(e=>e.hidden=!e.dataset.f.split(' ').includes(t));
 const r=RG[t];if(r){const s=$('#sz');s.min=r[0];s.max=r[1];s.value=S.sz[t];$('#szv').textContent=s.value}
 $('#tip').textContent=TL.find(x=>x[0]===t)[3]}
const TC=['#7c5cff','#ff5fa2','#f59e0b','#22c55e','#38bdf8','#ec4899','#14b8a6','#8b5cf6'];
TL.forEach(([k,i,n],j)=>{const b=document.createElement('button');b.dataset.t=k;b.style.setProperty('--c',TC[j]);b.innerHTML=`<i>${i}</i>${n}`;b.onclick=()=>{setTool(k);snd(520,.05)};$('#tools').append(b)});
$('#sz').oninput=e=>{const v=+e.target.value;S.sz[S.t]=v;$('#szv').textContent=v;const o=O[si];if(o&&o.k===(S.t==='st'?'e':'t')){edited();o.z=v;render()}};

const cols=$('#cols');
function setCol(c){S.c=c;const o=O[si];if(o&&o.k==='t'){edited();o.c=c;render()}[...cols.children].forEach(b=>b.classList.toggle('on',b.dataset.c===c))}
COL.forEach(c=>{const b=document.createElement('button');b.className='sw';b.dataset.c=c;b.style.background=c;b.setAttribute('aria-label','Colour '+c);b.onclick=()=>{setCol(c);snd(600,.05)};cols.insertBefore(b,cols.lastElementChild)});
$('#cp').oninput=e=>setCol(e.target.value);setCol(S.c);

function renderSt(k){const g=$('#stg');g.innerHTML='';[...$('#stc').children].forEach(b=>b.classList.toggle('on',b.textContent===k));
 ST[k].split(' ').forEach(e=>{const b=document.createElement('button');b.textContent=e;b.classList.toggle('on',e===S.sticker);b.onclick=()=>{S.sticker=e;const o=O[si];if(o&&o.k==='e'){edited();o.s=e;render()}g.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');snd(700,.06)};g.append(b)})}
Object.keys(ST).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>renderSt(k);$('#stc').append(b)});renderSt('🐶');

PG.forEach((p,i)=>{const b=document.createElement('button');b.innerHTML=`<i>${p[0]}</i>${p[1]}`;b.onclick=()=>setPage(i);$('#pgs').append(b)});
['Fredoka','Pacifico','Bangers','Chewy'].forEach(f=>{const o=document.createElement('option');o.textContent=o.value=f;$('#fs').append(o)});
$('#fs').onchange=e=>{S.font=e.target.value;const o=O[si];if(o&&o.k==='t'){edited();o.f=S.font}document.fonts.load(`40px "${S.font}"`).then(render,()=>0)};

function applyTh(){const[g,c]=TH[S.th];$('#fr').style.setProperty('--fg',g);document.querySelectorAll('.cn').forEach((e,i)=>e.textContent=c.split(' ')[i])}
$('#th').onclick=()=>{S.th=(S.th+1)%TH.length;applyTh();pop(8,innerWidth-60,60);snd(900,.1);toast('New look! '+TH[S.th][1].split(' ')[0])};
$('#sn').onclick=e=>{S.snd^=1;e.currentTarget.textContent=S.snd?'🔊 Sound on':'🔇 Sound off';snd(600)};
$('#un').onclick=undo;$('#re').onclick=redo;
$('#cl').onclick=()=>{save();O=[];si=-1;render();ax.fillStyle='#fff';ax.fillRect(0,0,W,H);done();toast('Fresh page! Tap ↶ to bring it back');snd(300,.2)};

/* ---------- save & share ---------- */
function out(){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(ac,0,0);x.drawImage(lc,0,0);x.drawImage(oc,0,0);return new Promise(r=>c.toBlob(r,'image/png'))}
async function download(){const b=await out(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='vedanshi-masterpiece.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);pop();snd(880,.25);toast('Masterpiece saved! 🏆')}
async function share(){const b=await out(),f=new File([b],'vedanshi-masterpiece.png',{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"VEDANSHI's masterpiece 🎨"})}catch(e){}}else{download();toast('Saved! Send it from your gallery 📤')}}
$('#sv').onclick=download;$('#sh').onclick=share;

addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo()}});

ax.fillStyle='#fff';ax.fillRect(0,0,W,H);
try{const d=JSON.parse(localStorage.getItem('vb')||'null');if(d&&d.w===W){S.page=d.p||0;const im=new Image();im.onload=()=>ax.drawImage(im,0,0,W,H);im.src=d.a}}catch(e){}
$('#fr').style.setProperty('--r',W/H);drawPage();applyTh();setTool('pen');upd();
$('#go').onclick=()=>{$('#L').remove();snd(660,.15);pop(16)};
})();
