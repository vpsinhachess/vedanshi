<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>VEDANSHI's White Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pacifico&family=Bangers&family=Chewy&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7fc;--card:#fff;--ink:#2d2a4a;--mut:#7a7699;--ln:#e7e2f5;--soft:#efe9ff;--p:#7c5cff;--k:#ff5fa2}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1a33;--card:#2a2648;--ink:#f3efff;--mut:#a9a3d1;--ln:#3b3663;--soft:#3b3663}}
:root[data-theme=dark]{--bg:#1d1a33;--card:#2a2648;--ink:#f3efff;--mut:#a9a3d1;--ln:#3b3663;--soft:#3b3663}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:Fredoka,ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 5% 0,#ffc6e777,transparent 35%),radial-gradient(circle at 100% 10%,#b8e4ff77,transparent 35%)}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:6px;padding:6px 10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;margin-right:auto;min-width:0}
.logo i{font-style:normal;font-size:26px;flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--ln)}
.logo b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{display:flex;gap:5px}
.hb button{width:42px;height:42px;border-radius:14px;background:var(--card);font-size:19px;box-shadow:0 3px 0 var(--ln);transition:transform .1s}
.hb button:active{transform:translateY(2px);box-shadow:none}
.hb button:disabled{opacity:.35}
.hb .pri{width:auto;padding:0 14px;background:linear-gradient(135deg,var(--p),var(--k));color:#fff;font-weight:700;box-shadow:0 3px 0 #5b3fd6}
.stage{container-type:size;display:grid;place-items:center;padding:8px 12px;min-height:0;min-width:0}
.frame{position:relative;width:min(100cqw,133.33cqh);aspect-ratio:4/3;padding:8px;border-radius:30px;background:var(--fg,linear-gradient(90deg,#ff5fa2,#ffb347,#ffe85a,#4ed88c,#4fc4ff,#8e69ff,#ff5fa2));box-shadow:0 14px 40px #3d2f8030,0 0 0 4px #fff}
.paper{position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;background:#fff}
.paper canvas{position:absolute;inset:0;width:100%;height:100%}
#ac{touch-action:none;cursor:crosshair}#lc{pointer-events:none}
.cn{position:absolute;z-index:2;font-size:clamp(18px,3.8vmin,34px);pointer-events:none;animation:bob 3.4s ease-in-out infinite}
.dock{background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -6px 30px #3d2f8018;padding:10px;display:flex;flex-direction:column;gap:9px;max-height:44dvh;overflow-y:auto}
.tools{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none}
.tools button{flex:0 0 68px;height:62px;border-radius:18px;background:var(--bg);border:2px solid var(--ln);font-size:12px;font-weight:600;display:grid;place-items:center;align-content:center;transition:transform .12s}
.tools i{font-style:normal;font-size:25px;line-height:1.1}
.tools button.on{background:linear-gradient(135deg,var(--p),var(--k));color:#fff;border-color:transparent;transform:translateY(-3px);box-shadow:0 8px 16px #7c5cff55}
.tray{display:flex;flex-direction:column;gap:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:7px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ln);position:relative;transition:transform .12s}
.sw.on{box-shadow:0 0 0 3px var(--p);transform:scale(1.14)}
.cus{overflow:hidden;background:conic-gradient(#f44,#fa0,#ee3,#4d4,#4af,#84f,#f4a,#f44)}
.cus input{position:absolute;inset:-10px;width:200%;height:200%;opacity:0;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.row input{flex:1;accent-color:var(--p);height:28px}.row b{width:32px;text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px}
.chips button{flex:none;width:44px;height:38px;border-radius:12px;background:var(--bg);font-size:21px}
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px;max-height:150px;overflow-y:auto}
.stg button{font-size:28px;height:46px;border-radius:12px;background:var(--bg)}
.chips .on,.stg .on,.pgs .on{background:var(--soft);box-shadow:0 0 0 2px var(--p)}
.pgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.pgs button{height:64px;border-radius:16px;background:var(--bg);border:2px solid var(--ln);font-size:13px;font-weight:600;display:grid;place-items:center;align-content:center}
.pgs i{font-style:normal;font-size:27px}
.tx{display:flex;gap:6px}
.tx input,.tx select{min-width:0;flex:1;height:44px;border-radius:12px;border:2px solid var(--ln);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit;-webkit-user-select:text;user-select:text}
.tip{font-size:12px;color:var(--mut);font-weight:500;margin:0}
@media(orientation:landscape) and (min-width:560px){
.app{grid-template-columns:minmax(0,1fr) clamp(240px,27vw,320px);grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1}
.dock{border-radius:26px 0 0 0;max-height:none;box-shadow:-6px 0 30px #3d2f8018}
.tools{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible}
.tools button{flex:none;height:58px}}
@media(max-width:480px){.hb{gap:4px}.hb button{width:36px;height:38px;font-size:17px}.hb .pri{width:36px;padding:0}.hb .pri span{display:none}.logo b{display:none}}
.L{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:var(--bg);background-image:radial-gradient(circle at 10% 10%,#ffc6e7aa,transparent 40%),radial-gradient(circle at 90% 90%,#b8e4ffaa,transparent 40%)}
.card{width:min(440px,100%);text-align:center;padding:30px 22px 24px;border-radius:34px;background:var(--card);box-shadow:0 24px 70px #3d2f8030}
.card h1{font-size:clamp(28px,7vw,40px);line-height:1.05;margin:8px 0 6px}
.card p{margin:0 0 22px;color:var(--mut);font-weight:500}
.art{font-size:66px;animation:bob 2.4s ease-in-out infinite}
.go{width:100%;height:62px;border-radius:20px;color:#fff;font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--p),var(--k));box-shadow:0 6px 0 #5b3fd6}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #5b3fd6}
#T{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translate(-50%,-10px);opacity:0;z-index:60;background:#2d2a4a;color:#fff;padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;pointer-events:none;transition:.2s;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#T.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;z-index:70;font-size:26px;pointer-events:none;animation:fly 1.05s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes bob{50%{transform:translateY(-4px) rotate(5deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app">
<header>
 <div class="logo"><i>🎨</i><b>VEDANSHI's White Board</b></div>
 <div class="hb">
  <button id="un" title="Undo" aria-label="Undo">↶</button><button id="re" title="Redo" aria-label="Redo">↷</button>
  <button id="cl" title="Clear page" aria-label="Clear page">🗑️</button><button id="th" title="New look" aria-label="New look">🎀</button>
  <button id="sn" title="Sound" aria-label="Sound">🔊</button><button id="sh" title="Share" aria-label="Share">📤</button>
  <button id="sv" class="pri" aria-label="Save">💾<span> Save</span></button>
 </div>
</header>
<main class="stage"><div class="frame" id="fr">
 <span class="cn" style="left:-6px;top:-10px">🌸</span><span class="cn" style="right:-6px;top:-10px;animation-delay:-.8s">🦄</span>
 <span class="cn" style="left:-6px;bottom:-10px;animation-delay:-1.7s">🦋</span><span class="cn" style="right:-6px;bottom:-10px;animation-delay:-2.6s">⭐</span>
 <div class="paper"><canvas id="ac"></canvas><canvas id="lc"></canvas></div>
</div></main>
<aside class="dock">
 <div class="tools" id="tools"></div>
 <div class="tray">
  <div class="grid" id="cols" data-f="pen sp fl tx"><label class="sw cus" title="Mix my own colour"><input type="color" id="cp" value="#ff4d4d" aria-label="Pick any colour"></label></div>
  <div class="row" data-f="pen rb sp er st tx"><span>Size</span><input type="range" id="sz" aria-label="Size"><b id="szv"></b></div>
  <div data-f="st"><div class="chips" id="stc"></div><div class="stg" id="stg"></div></div>
  <div class="tx" data-f="tx"><input id="ti" maxlength="40" placeholder="Type here, then tap the page" aria-label="Your words"><select id="fs" aria-label="Font"></select></div>
  <div class="pgs" id="pgs" data-f="pg"></div>
  <p class="tip" id="tip"></p>
 </div>
</aside>
</div>
<div class="L" id="L"><div class="card"><div class="art">🎨</div><h1>VEDANSHI's White Board</h1><p>Draw, colour and create!</p><button class="go" id="go">▶ Let's play!</button></div></div>
<div id="T" role="status"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),W=1400,H=1050;
const ac=$('#ac'),lc=$('#lc');ac.width=lc.width=W;ac.height=lc.height=H;
const ax=ac.getContext('2d',{willReadFrequently:true}),lx=lc.getContext('2d',{willReadFrequently:true});
const COL='#2d2a4a #ff4d4d #ff8a3d #ffc83d #ffe94d #9be15d #2ecc71 #14b8a6 #38bdf8 #3b82f6 #6366f1 #a855f7 #ec4899 #ff8fb8 #b5651d #f5d0a9 #ffffff #9ca3af'.split(' ');
const TL=[['pen','✏️','Pencil','Draw anything you like!'],['rb','🌈','Rainbow','Colours change as you draw.'],['sp','✨','Sparkle','Drag to sprinkle magic stars.'],['fl','🪣','Fill','Tap inside a shape to colour it.'],['er','🧽','Eraser','Rub out mistakes.'],['st','⭐','Stickers','Tap to stamp. Drag for a trail!'],['tx','🔤','Text','Type your words, then tap the page.'],['pg','🖼️','Pages','Pick a picture to colour in!']];
const RG={pen:[3,60],rb:[6,80],sp:[16,100],er:[16,160],st:[50,260],tx:[30,200]};
const ST={'🐶':'🐶 🐱 🐭 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐸 🐵 🐷 🦄 🐢 🐠 🐙 🦋 🐞 🐘 🦒 🐧 🦉 🦖','🌸':'🌸 🌺 🌻 🌷 🌹 🍀 🌳 🌈 🌙 ⭐ 🔥 🍎 🍓 🍉 🍭 🧁 🍦 🍕 🍩 🍪 🎂','😀':'😀 😁 😂 😍 🥰 😎 🤩 😴 😱 🤗 🥳 😇 🤠 🤖 👻 👽','🎈':'🎈 🎉 🎁 🎨 🏆 👑 💎 🚀 🚗 🚲 ⚽ 🏀 🎸 🎵 🪁 🏰 🧸 💖 💫 ✨ 🧚'};
const fl=[];for(let i=0;i<6;i++){const a=i*Math.PI/3,x=200+Math.cos(a)*70,y=120+Math.sin(a)*70;fl.push(`M${x-30} ${y}a30 30 0 1 0 60 0a30 30 0 1 0-60 0Z`)}
const PG=[['⬜','Blank',[]],
['💖','Heart',['M200 255C70 170 50 90 105 58C148 34 188 58 200 92C212 58 252 34 295 58C350 90 330 170 200 255Z']],
['⭐','Star',['M200 30L238 112L328 122L262 182L282 270L200 226L118 270L138 182L72 122L162 112Z']],
['🏠','House',['M90 140H310V262H90Z','M65 142L200 38L335 142Z','M172 262V190Q200 168 228 190V262Z','M112 168H152V208H112Z','M248 168H288V208H248Z','M334 50a26 26 0 1 0 52 0a26 26 0 1 0-52 0Z','M20 262H380']],
['🌸','Flower',[...fl,'M162 120a38 38 0 1 0 76 0a38 38 0 1 0-76 0Z','M194 190H206V285H194Z','M206 245C250 215 280 232 292 252C262 266 226 266 206 245Z','M194 255C150 225 120 242 108 262C138 276 174 276 194 255Z']],
['🐠','Fish',['M70 150C120 60 250 60 290 150C250 240 120 240 70 150Z','M288 150L350 98V202Z','M120 135a10 10 0 1 0 20 0a10 10 0 1 0-20 0Z','M170 82C180 50 220 50 235 90Z','M72 150Q90 162 102 152','M30 100a12 12 0 1 0 24 0a12 12 0 1 0-24 0Z']],
['🦋','Butterfly',['M192 95H208V225Q200 250 192 225Z'],['M192 140C150 40 60 40 62 110C64 160 140 168 192 150Z','M192 160C140 170 80 180 96 235C112 275 175 250 192 205Z','M110 100a14 14 0 1 0 28 0a14 14 0 1 0-28 0Z','M196 95Q185 55 165 45']]];
const TH=[['linear-gradient(90deg,#ff5fa2,#ffb347,#ffe85a,#4ed88c,#4fc4ff,#8e69ff,#ff5fa2)','🌸 🦄 🦋 ⭐'],['linear-gradient(135deg,#38bdf8,#818cf8,#22d3ee)','🐠 🐳 🐙 🌊'],['linear-gradient(135deg,#ff78ac,#ffd36e,#7de3ca)','🍭 🍬 🧁 🍩'],['linear-gradient(135deg,#312e81,#7c3aed,#ec4899)','🚀 🌙 ⭐ 🪐'],['linear-gradient(135deg,#86efac,#fde047,#fda4af)','🌷 🐞 🌻 🐝']];
const S={t:'pen',c:'#ff4d4d',sz:{pen:14,rb:24,sp:44,er:56,st:120,tx:72},sticker:'⭐',page:0,font:'Fredoka',snd:1,h:[],r:[],th:0};
let hue=0,pid=null,lp,pm,sl,AC,at;

/* ---------- helpers ---------- */
const toast=m=>{const t=$('#T');t.textContent=m;t.classList.add('on');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('on'),1700)};
function snd(f=600,d=.08){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.6,t+d);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}
function pop(n=22,x=innerWidth/2,y=innerHeight/2){const g=['🎉','✨','🌈','⭐','💖','🎈','🦄'];for(let i=0;i<n;i++){const s=document.createElement('span');s.className='cf';s.textContent=g[i%g.length];s.style.cssText=`left:${x}px;top:${y}px;--x:${(Math.random()-.5)*360}px;--y:${(Math.random()-.8)*300}px;--r:${Math.random()*540}deg`;document.body.append(s);setTimeout(()=>s.remove(),1100)}}
const pt=e=>{const r=ac.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height,p:e.pointerType==='pen'&&e.pressure?e.pressure:.5}};

/* ---------- history (ImageData: instant, lossless) ---------- */
const snap=()=>({d:ax.getImageData(0,0,W,H),p:S.page});
const hp=(a,s)=>{a.push(s);if(a.length>10)a.shift()};
const upd=()=>{$('#un').disabled=!S.h.length;$('#re').disabled=!S.r.length};
const done=()=>{upd();clearTimeout(at);at=setTimeout(()=>{try{localStorage.setItem('vb',JSON.stringify({a:ac.toDataURL('image/jpeg',.7),p:S.page}))}catch(e){}},900)};
function save(){hp(S.h,snap());S.r=[];upd()}
function put(s){ax.putImageData(s.d,0,0);if(s.p!==S.page){S.page=s.p;drawPage()}done()}
function undo(){if(!S.h.length)return;hp(S.r,snap());put(S.h.pop());snd(300)}
function redo(){if(!S.r.length)return;hp(S.h,snap());put(S.r.pop());snd(400)}

/* ---------- colouring pages (outline layer sits above the paint) ---------- */
function drawPage(){const p=PG[S.page];lx.setTransform(1,0,0,1,0,0);lx.clearRect(0,0,W,H);lx.strokeStyle='#2d2a4a';lx.lineWidth=2.4;lx.lineJoin=lx.lineCap='round';
 lx.setTransform(3.5,0,0,3.5,0,0);p[2].forEach(d=>lx.stroke(new Path2D(d)));
 lx.setTransform(-3.5,0,0,3.5,W,0);(p[3]||[]).forEach(d=>lx.stroke(new Path2D(d)));lx.setTransform(1,0,0,1,0,0);
 document.querySelectorAll('#pgs button').forEach((b,i)=>b.classList.toggle('on',i===S.page))}
function setPage(i){save();ax.fillStyle='#fff';ax.fillRect(0,0,W,H);S.page=i;drawPage();done();setTool(i?'fl':'pen');toast(i?'Tap a shape to fill it! 🪣':'Blank page ✨');snd(700,.12)}

/* ---------- drawing ---------- */
function sty(c){ax.lineCap=ax.lineJoin='round';ax.strokeStyle=ax.fillStyle=S.t==='er'?'#fff':S.t==='rb'?`hsl(${hue=(hue+4)%360},90%,55%)`:S.c;ax.lineWidth=S.sz[S.t]*(.4+1.2*c.p)}
function dot(p){sty(p);ax.beginPath();ax.arc(p.x,p.y,ax.lineWidth/2,0,7);ax.fill()}
function seg(a,c,b){sty(c);ax.beginPath();ax.moveTo(a.x,a.y);ax.quadraticCurveTo(c.x,c.y,b.x,b.y);ax.stroke()}
function spark(a,b){const s=S.sz.sp,d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/(s*.35)));
 for(let i=0;i<n;i++){const t=(i+1)/n,x=a.x+(b.x-a.x)*t+(Math.random()-.5)*s,y=a.y+(b.y-a.y)*t+(Math.random()-.5)*s,r=s*(.12+Math.random()*.28);
  ax.fillStyle=Math.random()<.25?'#fff':S.c;ax.shadowColor=S.c;ax.shadowBlur=r;
  ax.beginPath();ax.moveTo(x,y-r);ax.quadraticCurveTo(x,y,x+r,y);ax.quadraticCurveTo(x,y,x,y+r);ax.quadraticCurveTo(x,y,x-r,y);ax.quadraticCurveTo(x,y,x,y-r);ax.fill()}
 ax.shadowBlur=0}
function stamp(p){ax.save();ax.translate(p.x,p.y);ax.rotate((Math.random()-.5)*.4);ax.font=`${S.sz.st}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;ax.textAlign='center';ax.textBaseline='middle';ax.fillText(S.sticker,0,0);ax.restore();snd(500+Math.random()*300,.06)}
async function text(p){const v=$('#ti').value.trim()||'Hello!';try{await document.fonts.load(`40px "${S.font}"`)}catch(e){}
 save();ax.save();ax.font=`600 ${S.sz.tx}px "${S.font}",cursive`;ax.textAlign='center';ax.textBaseline='middle';ax.fillStyle=S.c;ax.shadowColor='#0003';ax.shadowBlur=4;ax.fillText(v,p.x,p.y);ax.restore();done();snd(800,.1)}
function flood(p){const x=p.x|0,y=p.y|0,i0=y*W+x,im=ax.getImageData(0,0,W,H),d=new Uint32Array(im.data.buffer),L=lx.getImageData(0,0,W,H).data;
 if(L[i0*4+3]>90){toast('Tap inside a shape 😊');return}
 const t=d[i0],tr=t&255,tg=t>>8&255,tb=t>>16&255,h=S.c,c=(255<<24)|(parseInt(h.slice(5,7),16)<<16)|(parseInt(h.slice(3,5),16)<<8)|parseInt(h.slice(1,3),16);
 if(t===c)return;save();
 const seen=new Uint8Array(W*H),st=[i0];seen[i0]=1;
 const nb=j=>{if(seen[j])return;seen[j]=1;if(L[j*4+3]>90)return;const v=d[j];if(Math.abs((v&255)-tr)+Math.abs((v>>8&255)-tg)+Math.abs((v>>16&255)-tb)>90)return;st.push(j)};
 while(st.length){const i=st.pop(),cx=i%W;d[i]=c;if(cx>0)nb(i-1);if(cx<W-1)nb(i+1);if(i>=W)nb(i-W);if(i<W*H-W)nb(i+W)}
 ax.putImageData(im,0,0);done();snd(760,.15);pop(6,innerWidth/2,innerHeight/2)}

ac.addEventListener('pointerdown',e=>{
 if(pid!==null)return;e.preventDefault();const p=pt(e),t=S.t;
 if(t==='tx'){text(p);return}
 if(t==='fl'){flood(p);return}
 if(t==='pg')return;
 save();pid=e.pointerId;try{ac.setPointerCapture(pid)}catch(x){}
 lp=pm=sl=p;
 if(t==='st')stamp(p);else if(t==='sp')spark(p,p);else dot(p)});
ac.addEventListener('pointermove',e=>{
 if(e.pointerId!==pid)return;e.preventDefault();
 const ev=e.getCoalescedEvents?.();
 for(const q of(ev&&ev.length?ev:[e])){const p=pt(q),t=S.t;
  if(t==='st'){if(Math.hypot(p.x-sl.x,p.y-sl.y)>S.sz.st*.8){stamp(p);sl=p}}
  else if(t==='sp'){spark(lp,p);lp=p}
  else{const m={x:(lp.x+p.x)/2,y:(lp.y+p.y)/2,p:p.p};seg(pm,lp,m);pm=m;lp=p}}});
const end=e=>{if(e.pointerId!==pid)return;if(['pen','rb','er'].includes(S.t))seg(pm,lp,lp);pid=null;done()};
ac.addEventListener('pointerup',end);ac.addEventListener('pointercancel',end);

/* ---------- UI ---------- */
function setTool(t){S.t=t;
 document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 document.querySelectorAll('[data-f]').forEach(e=>e.hidden=!e.dataset.f.split(' ').includes(t));
 const r=RG[t];if(r){const s=$('#sz');s.min=r[0];s.max=r[1];s.value=S.sz[t];$('#szv').textContent=s.value}
 $('#tip').textContent=TL.find(x=>x[0]===t)[3]}
TL.forEach(([k,i,n])=>{const b=document.createElement('button');b.dataset.t=k;b.innerHTML=`<i>${i}</i>${n}`;b.onclick=()=>{setTool(k);snd(520,.05)};$('#tools').append(b)});
$('#sz').oninput=e=>{S.sz[S.t]=+e.target.value;$('#szv').textContent=e.target.value};

const cols=$('#cols');
function setCol(c){S.c=c;[...cols.children].forEach(b=>b.classList.toggle('on',b.dataset.c===c))}
COL.forEach(c=>{const b=document.createElement('button');b.className='sw';b.dataset.c=c;b.style.background=c;b.setAttribute('aria-label','Colour '+c);b.onclick=()=>{setCol(c);snd(600,.05)};cols.insertBefore(b,cols.lastElementChild)});
$('#cp').oninput=e=>setCol(e.target.value);setCol(S.c);

function renderSt(k){const g=$('#stg');g.innerHTML='';[...$('#stc').children].forEach(b=>b.classList.toggle('on',b.textContent===k));
 ST[k].split(' ').forEach(e=>{const b=document.createElement('button');b.textContent=e;b.classList.toggle('on',e===S.sticker);b.onclick=()=>{S.sticker=e;g.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');snd(700,.06)};g.append(b)})}
Object.keys(ST).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>renderSt(k);$('#stc').append(b)});renderSt('🐶');

PG.forEach((p,i)=>{const b=document.createElement('button');b.innerHTML=`<i>${p[0]}</i>${p[1]}`;b.onclick=()=>setPage(i);$('#pgs').append(b)});
['Fredoka','Pacifico','Bangers','Chewy'].forEach(f=>{const o=document.createElement('option');o.textContent=o.value=f;$('#fs').append(o)});
$('#fs').onchange=e=>{S.font=e.target.value;document.fonts.load(`40px "${S.font}"`)};

function applyTh(){const[g,c]=TH[S.th];$('#fr').style.setProperty('--fg',g);document.querySelectorAll('.cn').forEach((e,i)=>e.textContent=c.split(' ')[i])}
$('#th').onclick=()=>{S.th=(S.th+1)%TH.length;applyTh();pop(8,innerWidth-60,60);snd(900,.1);toast('New look! '+TH[S.th][1].split(' ')[0])};
$('#sn').onclick=e=>{S.snd^=1;e.currentTarget.textContent=S.snd?'🔊':'🔇';snd(600)};
$('#un').onclick=undo;$('#re').onclick=redo;
$('#cl').onclick=()=>{save();ax.fillStyle='#fff';ax.fillRect(0,0,W,H);done();toast('Fresh page! Tap ↶ to bring it back');snd(300,.2)};

/* ---------- save & share ---------- */
function out(){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(ac,0,0);x.drawImage(lc,0,0);return new Promise(r=>c.toBlob(r,'image/png'))}
async function download(){const b=await out(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='vedanshi-masterpiece.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);pop();snd(880,.25);toast('Masterpiece saved! 🏆')}
async function share(){const b=await out(),f=new File([b],'vedanshi-masterpiece.png',{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"VEDANSHI's masterpiece 🎨"})}catch(e){}}else{download();toast('Saved! Send it from your gallery 📤')}}
$('#sv').onclick=download;$('#sh').onclick=share;

addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo()}});

/* ---------- start ---------- */
ax.fillStyle='#fff';ax.fillRect(0,0,W,H);
try{const d=JSON.parse(localStorage.getItem('vb')||'null');if(d){S.page=d.p||0;const im=new Image();im.onload=()=>ax.drawImage(im,0,0,W,H);im.src=d.a}}catch(e){}
drawPage();applyTh();setTool('pen');upd();
$('#go').onclick=()=>{$('#L').remove();snd(660,.15);pop(16)};
})();
